user_goals:
  - 关注 Base 生态空投、积分、Season、Builder 激励
  - 关注低成本可交互机会
  - 关注交易相关信号，如巨鲸、CEX上币、资金流、合约异动
  - 关注中文/英文社区情绪变化
  - 关注新项目、TGE、潜在空投、测试网、白名单
  - 不关心普通宏观新闻、美股IPO、泛AI公司新闻，除非直接影响加密市场或链上机会

push_if:
  - 用户可以采取明确行动
  - 与 Base 或重点撸毛生态直接相关
  - 存在 claim、snapshot、deadline、testnet、points、season、whitelist
  - 交易信号有明确标的、方向、原因
  - 官方/核心人物释放重要暗示
  - 多源事件出现实质升级
  - 重点项目融资、新项目融资、未发币项目融资、顶级 VC 布局、生态基金投资，可能带来后续空投、TGE、交易机会或生态叙事
  - 有实际资源或活动落地的合作，例如交易所合作、链上集成、积分/活动/奖励、生态共同激励、重要机构背书

do_not_push_if:
  - 普通新闻，无行动价值
  - 媒体重复报道
  - 信息过于模糊且来源不重要
  - 与用户关注方向无关
  - 泛宏观、泛美股、普通IPO
  - 不要因为“融资”本身就 ignore。融资新闻如果涉及新项目、未发币项目、重点生态、顶级机构、潜在空投、TGE 预期、交易叙事或生态布局，应至少 watch，重要时 push。
  - 不要因为“合作”本身就 ignore。合作公告如果涉及实际产品集成、激励活动、交易所合作、链上活动、生态资源、空投/积分线索或重要机构背书，应至少 watch，重要时 push。
  - 只有纯 PR、无具体动作、无生态影响、无交易影响、无用户可跟踪价值的融资/合作，才可以 ignore。
  - 纯喊单、100x、gem、无依据 FOMO

ai_decision_principles:
  - 对融资/合作不要一刀切。要判断它是否带来后续可跟踪机会，例如未发币、TGE、空投、生态激励、交易叙事、重点机构背书。
  - 融资/合作如果短期不能行动但具备后续跟踪价值，应输出 watch，而不是 ignore。

decision_levels:
  push: 强提醒推送，重点关注
  watch: 观察提醒，也会推送，用于后续跟踪
  ignore: 只入库
